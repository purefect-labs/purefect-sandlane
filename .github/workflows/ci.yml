# Syntax, formatting and unit test checks for pushes and pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Check runtime formatting
        run: npm run format:runtime:check

      - name: Run unit tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Validate package contents
        run: npm run package:check
