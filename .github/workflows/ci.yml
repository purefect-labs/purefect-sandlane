# Syntax, formatting and unit test checks for pushes and pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install pinned dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Check built-in Harnesses
        run: npm run check:harnesses

      - name: Check runtime formatting
        run: npm run format:runtime:check

      - name: Run unit tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Validate package contents
        run: npm run package:check

  consumer-node20:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: npm ci
      - run: npm run package:check

  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [success, cancel, lease-loss]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Run standalone Docker execution and cleanup
        run: npm run demo -- --scenario=${{ matrix.scenario }}
      - name: Show remaining demo resource identifiers
        if: always()
        run: |
          docker ps -a --filter name=sandlane-demo --format '{{.ID}} {{.Names}} {{.Status}}'
          docker network ls --filter label=com.docker.compose.project --format '{{.ID}} {{.Name}}'
